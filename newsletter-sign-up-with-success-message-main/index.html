<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link type="text/css" href="./desktop-design.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Newsletter sign-up form with success message</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <!-- Sign-up form start -->
  <article>
    <picture>
      <source media="(max-width:600px)" srcset="assets\images\illustration-sign-up-mobile.svg">
      <img src="assets/images/illustration-sign-up-desktop.svg">
    </picture>
    <main>
      <div class="article-content">
        <h1>Stay updated!</h1>
        <p>Join 60,000+ product managers recieving monthly updates on:</p>
        <p>
            <img src="./assets/images/icon-success.svg" class="success-icon">
             Product discovery and building what matters
        </p>
        <p>
            <img src="./assets/images/icon-success.svg" class="success-icon">
             Measuring to ensure updates are a success
        </p>
        <p>
            <img src="./assets/images/icon-success.svg" class="success-icon">
             And much more fun!
        </p>
      </div>
      <form>
         <label for="email-address">Email address</label>
         <input type="text" id="email-address" name="email-address" value="email@company.com">
         <input type="button" value="Subscribe to monthly newsletter">
      </form>
    </main>
  </article>
<!-- 
  Subscribe to monthly newsletter

 Sign-up form end -->

  </div> -->
</body>
</html>
